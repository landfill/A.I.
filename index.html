<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A.I. 팝업북</title>
<meta name="description" content="영화 「A.I.」의 이야기를 열네 장면의 입체 팝업북으로 다시 엮은 헌정 작품. 그림, 음악, 낭독 모두 코드로 만들었습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#07080f;
    --ink:#0c0f1d;
    --gold:#d9b877;
    --gold-soft:rgba(217,184,119,.42);
    --mist:#a3abc9;
    --text:#efe9f6;
    --panel:rgba(9,11,22,.52);
    color-scheme:dark;
  }
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;background:var(--night);color:var(--text);overflow:hidden}
  body{font-family:"Gowun Batang","Nanum Myeongjo","AppleMyungjo","Batang",serif;-webkit-font-smoothing:antialiased}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
  .veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 42%,rgba(0,0,0,0) 50%,rgba(3,4,10,.62) 100%)}
  button{font:inherit;color:inherit}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  .top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
       padding:calc(14px + env(safe-area-inset-top,0px)) 20px 0;pointer-events:none}
  .top>*{pointer-events:auto}
  .mark{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:24px;letter-spacing:.04em;color:var(--gold);line-height:1}
  .mark small{font-family:"Gowun Batang",serif;font-style:normal;font-size:12px;letter-spacing:.24em;color:var(--mist);margin-left:10px;vertical-align:3px}
  .chap{margin-top:8px;font-size:14px;color:var(--mist);display:flex;gap:10px;align-items:baseline;opacity:0;transition:opacity .8s}
  .chap .no{font-family:"Cormorant Garamond",Georgia,serif;font-size:16px;font-variant-numeric:tabular-nums;color:var(--gold)}
  .chap .ti{color:var(--text);letter-spacing:.06em}
  body.open .chap{opacity:1}
  .toggles{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
  .tg{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid rgba(163,171,201,.28);
      background:var(--panel);font-size:13px;letter-spacing:.04em;cursor:pointer;transition:border-color .3s,opacity .3s,color .3s}
  .tg svg{width:15px;height:15px;flex:none}
  .tg:hover{border-color:var(--gold-soft)}
  .tg[aria-pressed="false"]{opacity:.5}
  .tg[aria-pressed="true"]{color:#f6ecd4}

  .caption{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
  .caption p{max-width:34em;margin:0;text-align:center;font-size:clamp(16px,1.75vw,21px);line-height:1.8;color:#f6f1fb;word-break:keep-all;
       text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 22px rgba(6,8,20,.95),0 0 44px rgba(6,8,20,.8);transition:opacity .55s ease,transform .55s ease}
  .caption p.out{opacity:0;transform:translateY(6px)}

  .nav{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:16px;
       opacity:0;pointer-events:none;transition:opacity .8s}
  body.open .nav{opacity:1;pointer-events:auto}
  body.closing .nav,body.closing .chap,body.closing .caption{opacity:0;pointer-events:none}
  body.open .cover{opacity:0;pointer-events:none}
  body.open .caption{display:flex}
  .arrow{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold-soft);background:var(--panel);color:var(--gold);cursor:pointer;display:grid;place-items:center;transition:border-color .3s,opacity .3s}
  .arrow svg{width:18px;height:18px}
  .arrow:hover{border-color:var(--gold)}
  .arrow:disabled{opacity:.25;cursor:default}
  .dots{display:flex;gap:2px;align-items:center}
  .dot{width:20px;height:24px;border:0;padding:0;background:none;cursor:pointer;display:grid;place-items:center}
  .dot::before{content:"";width:6px;height:6px;border-radius:50%;background:rgba(239,233,246,.28);transition:background .4s,box-shadow .4s,transform .4s}
  .dot:hover::before{background:rgba(239,233,246,.6)}
  .dot.on::before{background:var(--gold);box-shadow:0 0 10px var(--gold);transform:scale(1.35)}
  .count{display:none;font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:4.2em;text-align:center}
  .home{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 16px 0 13px;border-radius:999px;border:1px solid rgba(163,171,201,.3);background:var(--panel);
        font-size:13.5px;letter-spacing:.06em;cursor:pointer;transition:border-color .3s;margin-right:4px}
  .home svg{width:17px;height:17px}
  .home:hover{border-color:var(--gold-soft)}
  body.en .caption p{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(18px,2vw,24px);line-height:1.55;font-weight:500}
  body.en .chap .ti{font-family:"Cormorant Garamond",Georgia,serif;font-size:16px;font-style:italic;letter-spacing:.02em}
  body.en .eyebrow{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:17px;letter-spacing:.12em}
  body.en .open-btn{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;letter-spacing:.2em}
  .again{height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--gold);background:var(--panel);color:var(--gold);letter-spacing:.14em;cursor:pointer}

  .cover{position:fixed;left:16px;right:16px;bottom:calc(34px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;transition:opacity .8s}
  .eyebrow{margin:0;font-size:14px;letter-spacing:.3em;color:var(--mist)}
  .open-btn{font-size:17px;letter-spacing:.34em;padding:15px 30px 15px 38px;border:1px solid var(--gold);color:var(--gold);background:rgba(10,12,24,.6);border-radius:999px;cursor:pointer;
            box-shadow:0 0 34px rgba(217,184,119,.18);transition:box-shadow .4s,background .4s}
  .open-btn:hover{box-shadow:0 0 44px rgba(217,184,119,.36);background:rgba(24,22,30,.7)}
  .open-btn:disabled{opacity:.4;cursor:wait}
  .hint{margin:0;font-size:13px;color:var(--mist);line-height:1.6;word-break:keep-all}
  .credit{margin:0;font-size:11.5px;color:rgba(163,171,201,.7);max-width:40em;line-height:1.7;word-break:keep-all}
  .note{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));font-size:12.5px;color:var(--mist);background:var(--panel);
        border:1px solid rgba(163,171,201,.2);padding:7px 14px;border-radius:999px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}

  .loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--night);color:var(--mist);font-size:15px;letter-spacing:.24em;transition:opacity 1.2s}
  .loading.gone{opacity:0;pointer-events:none}

  @media (max-width:640px){
    .dots{display:none}
    .count{display:block}
    .tg span{display:none}
    .tg.tg-lang span{display:inline}
    .home{padding:0 13px 0 11px;margin-right:0}
    .nav{gap:10px}
    .tg{padding:0 10px}
    .top{padding-left:16px;padding-right:16px}
    .mark small{display:none}
    .caption{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  }
  @media (prefers-reduced-motion:reduce){
    .caption p,.chap,.nav,.cover,.loading{transition:none}
  }
</style>

<canvas id="gl" aria-label="입체 팝업북 장면"></canvas>
<div class="veil"></div>

<header class="top">
  <div>
    <div class="mark">A.I.<small data-t="mark">팝업북</small></div>
    <div class="chap" aria-live="polite"><span class="no" id="chapNo"></span><span class="ti" id="chapTitle"></span></div>
  </div>
  <div class="toggles">
    <button class="tg tg-lang" id="tgLang" data-tt="langTip" title="Read in English">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span data-t="lang">English</span></button>
    <button class="tg" id="tgMusic" aria-pressed="true" data-tt="musicTip" title="배경음악 켜기/끄기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span data-t="music">음악</span></button>
    <button class="tg" id="tgVoice" aria-pressed="true" data-tt="voiceTip" title="낭독 켜기/끄기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg><span data-t="voice">낭독</span></button>
    <button class="tg" id="tgAuto" aria-pressed="true" data-tt="autoTip" title="낭독이 끝나면 자동으로 다음 장 넘기기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9a5 5 0 0 1 0 10H6"/><path d="M9 11l-4 4 4 4"/></svg><span data-t="auto">자동 넘김</span></button>
    <button class="tg" id="tgReplay" data-tt="replayTip" title="이 장면 다시 듣기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span data-t="replay">다시 듣기</span></button>
  </div>
</header>

<div class="note" id="voiceNote" hidden></div>

<section class="caption" aria-live="polite"><p id="capText"></p></section>

<nav class="nav" data-ta="navLabel" aria-label="책장 넘기기">
  <button class="home" id="homeBtn" data-tt="homeTip" title="책을 덮고 표지로 돌아가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg><span data-t="home">표지로</span></button>
  <button class="arrow" id="prevBtn" data-ta="prev" aria-label="이전 장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="dots" id="dots"></div>
  <div class="count" id="count"></div>
  <button class="arrow" id="nextBtn" data-ta="next" aria-label="다음 장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <button class="again" id="againBtn" data-t="again" hidden>처음부터 다시 읽기</button>
</nav>

<div class="cover" id="coverUI">
  <p class="eyebrow" data-t="eyebrow">사랑을 배운 아이의 이야기</p>
  <button class="open-btn" id="openBtn" data-t="open" disabled>책 펼치기</button>
  <p class="hint" data-t="hint" data-html>소리를 켜 두세요. 한 여성 나레이터가 열네 장면을 차례로 읽어 드려요.<br>화살표 키나 좌우로 쓸어 넘기기로 책장을 넘길 수 있어요.</p>
  <p class="credit" data-t="credit">스티븐 스필버그 감독의 영화 「A.I.」(2001)에 바치는 비공식 헌정 팝업북입니다. 모든 그림과 음악, 목소리는 코드로 만들었습니다.</p>
</div>

<div class="loading" id="loading" data-t="loading">종이를 접고 있어요…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
(function(){
/* =========================================================
   기본 유틸
   ========================================================= */
const W = 5, H = 7, TAU = Math.PI * 2;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeBack = t => { const c1 = 1.25, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function hexA(h, a){ if(h[0] !== '#') return h; const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

const grainCv = (() => { const c = mk(128, 128), g = c.getContext('2d'), d = g.createImageData(128, 128), r = rng(3);
  for(let i = 0; i < d.data.length; i += 4){ const v = r() < .5 ? 0 : 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = r() * 26; }
  g.putImageData(d, 0, 0); return c; })();

/* =========================================================
   종이 오리기 도구 (세계 단위로 그림)
   ========================================================= */
const D = {
  lg(g, x0, y0, x1, y1, st){ const q = g.createLinearGradient(x0, y0, x1, y1); st.forEach(s => q.addColorStop(s[0], s[1])); return q; },
  rg(g, x, y, r0, r1, st){ const q = g.createRadialGradient(x, y, r0, x, y, r1); st.forEach(s => q.addColorStop(s[0], s[1])); return q; },
  ell(g, c, x, y, rx, ry, rot){ g.beginPath(); g.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, TAU); g.fillStyle = c; g.fill(); },
  rect(g, c, x, y, w, h){ g.fillStyle = c; g.fillRect(x, y, w, h); },
  rr(g, x, y, w, h, r){ r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); },
  rrf(g, c, x, y, w, h, r){ D.rr(g, x, y, w, h, r); g.fillStyle = c; g.fill(); },
  poly(g, c, p){ g.beginPath(); g.moveTo(p[0], p[1]); for(let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.closePath(); g.fillStyle = c; g.fill(); },
  line(g, c, lw, p){ g.beginPath(); g.moveTo(p[0], p[1]); for(let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.strokeStyle = c; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke(); },
  back(g, w, h, fill, r){ r = r ?? .35; g.beginPath(); g.moveTo(0, h); g.lineTo(0, r); g.quadraticCurveTo(0, 0, r, 0); g.lineTo(w - r, 0); g.quadraticCurveTo(w, 0, w, r); g.lineTo(w, h); g.closePath(); g.fillStyle = fill; g.fill(); },
  arch(g, w, h, fill, k){ k = k ?? .3; g.beginPath(); g.moveTo(0, h); g.lineTo(0, h * k); g.bezierCurveTo(w * .08, -h * .03, w * .92, -h * .03, w, h * k); g.lineTo(w, h); g.closePath(); g.fillStyle = fill; g.fill(); },
  atop(g, fn){ g.save(); g.globalCompositeOperation = 'source-atop'; fn(); g.restore(); },
  cut(g, fn){ g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; g.strokeStyle = '#000'; fn(); g.restore(); },
  stars(g, w, h, n, seed, c, rmax){ const r = rng(seed); g.fillStyle = c; for(let i = 0; i < n; i++){ g.globalAlpha = .35 + r() * .65; g.beginPath(); g.arc(r() * w, r() * h, .008 + r() * (rmax || .022), 0, TAU); g.fill(); } g.globalAlpha = 1; },
  window(g, x, y, w, h, frame, glass, fw){ fw = fw || .07; D.rrf(g, frame, x, y, w, h, .04); D.rrf(g, glass, x + fw, y + fw, w - fw * 2, h - fw * 2, .02); },

  person(g, x, base, Hh, o){
    o = o || {}; const k = o.kind || 'child', c = o.color || '#222', d = o.dir || 1, pose = o.pose || 'stand';
    const child = k === 'child', woman = k === 'woman', mecha = k === 'mecha';
    const hr = Hh * (child ? .1 : mecha ? .06 : .066);
    const headH = mecha ? hr * 1.7 : hr;
    const hy = base - Hh + headH;
    const shY = hy + headH + Hh * (child ? .03 : mecha ? .03 : .045);
    const shW = Hh * (child ? .2 : woman ? .16 : mecha ? .12 : .21);
    const hipY = base - Hh * (child ? .43 : mecha ? .53 : .48);
    const hipW = Hh * (child ? .15 : woman ? .15 : mecha ? .07 : .15);
    const lw = Hh * (child ? .062 : mecha ? .024 : .048);
    const kneel = pose === 'kneel';
    g.fillStyle = c;
    if(woman) D.ell(g, c, x - d * hr * .12, hy + hr * .6, hr * 1.12, hr * 1.55);
    if(!kneel){
      const st = (o.stride || 0) * Hh;
      D.line(g, c, lw * 1.05, [x - hipW * .28, hipY, x - hipW * .3 - st, base - lw * .5]);
      D.line(g, c, lw * 1.05, [x + hipW * .28, hipY, x + hipW * .3 + st, base - lw * .5]);
      D.ell(g, c, x - hipW * .3 - st + d * lw * .15, base - lw * .38, lw * .8, lw * .38);
      D.ell(g, c, x + hipW * .3 + st + d * lw * .15, base - lw * .38, lw * .8, lw * .38);
    }
    g.beginPath(); g.moveTo(x - shW / 2, shY + lw * .6); g.quadraticCurveTo(x - shW / 2, shY, x - shW / 2 + lw * .8, shY);
    g.lineTo(x + shW / 2 - lw * .8, shY); g.quadraticCurveTo(x + shW / 2, shY, x + shW / 2, shY + lw * .6);
    g.lineTo(x + hipW / 2, hipY + lw * .3); g.lineTo(x - hipW / 2, hipY + lw * .3); g.closePath(); g.fillStyle = c; g.fill();
    if(woman || kneel){
      const sb = kneel ? base : base - Hh * .16, sw = Hh * (kneel ? .38 : .3), wy = hipY - Hh * .05;
      g.beginPath(); g.moveTo(x - hipW * .5, wy); g.lineTo(x + hipW * .5, wy);
      g.quadraticCurveTo(x + sw * .42, sb - Hh * .12, x + sw / 2, sb); g.lineTo(x - sw / 2, sb);
      g.quadraticCurveTo(x - sw * .42, sb - Hh * .12, x - hipW * .5, wy); g.closePath(); g.fill();
    }
    if(o.coat){ g.beginPath(); g.moveTo(x - shW / 2, shY + lw * .5); g.lineTo(x + shW / 2, shY + lw * .5); g.lineTo(x + Hh * .16, base - Hh * .22); g.lineTo(x - Hh * .16, base - Hh * .22); g.closePath(); g.fill(); }
    g.fillRect(x - hr * .3, hy + headH * .5, hr * .6, shY - hy - headH * .3);
    D.ell(g, c, x, hy, hr * (mecha ? .68 : .9), headH);
    if(child) D.ell(g, c, x - d * hr * .06, hy - hr * .26, hr * .98, hr * .8);
    if(woman) D.ell(g, c, x + d * hr * .25, hy - hr * .58, hr * .58, hr * .44);
    if(o.hat){ D.ell(g, c, x, hy - hr * .62, hr * 1.65, hr * .22); D.rrf(g, c, x - hr * .82, hy - hr * 1.6, hr * 1.64, hr * 1.02, hr * .26); }
    const al = Hh * (child ? .31 : mecha ? .44 : .37), sx = shW / 2 - lw * .45, sy = shY + lw * .5;
    const P = { stand:[[-1,.1,.06],[1,.1,.06]], hold:[[-1,.35,-1.9],[1,.35,-1.9]], pray:[[-1,.22,-2.4],[1,.22,-2.4]],
      open:[[-1,2.35,.25],[1,2.35,.25]], reach:[[-d,.12,.06],[d,1.95,.2]], out:[[-d,.12,.06],[d,1.4,.1]], wave:[[-d,.12,.06],[d,2.6,.3]] };
    let hand = [x, sy];
    (P[o.arms || (kneel ? 'out' : pose)] || P.stand).forEach(([s, a, b]) => {

/* 오려낸 종이의 흰 단면, 결, 음영을 입힘 */
function finishPaper(cv, g, rimColor, rimPx){
  const w = cv.width, h = cv.height, t = mk(w, h), tg = t.getContext('2d');
  tg.drawImage(cv, 0, 0); tg.globalCompositeOperation = 'source-in'; tg.fillStyle = rimColor; tg.fillRect(0, 0, w, h);
  g.save(); g.globalCompositeOperation = 'destination-over';
  [rimPx * .5, rimPx].forEach(rp => { for(let a = 0; a < 8; a++) g.drawImage(t, Math.cos(a * Math.PI / 4) * rp, Math.sin(a * Math.PI / 4) * rp); });
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = g.createPattern(grainCv, 'repeat'); g.fillRect(0, 0, w, h);
  const q = g.createLinearGradient(0, 0, 0, h); q.addColorStop(0, 'rgba(255,255,255,.05)'); q.addColorStop(1, 'rgba(0,0,0,.16)'); g.fillStyle = q; g.fillRect(0, 0, w, h);
  g.restore();
}

  dots(g, c, n, seed, x0, y0, x1, y1, r0, r1){ const r = rng(seed); g.fillStyle = c; for(let i = 0; i < n; i++){ g.beginPath(); g.arc(x0 + (x1 - x0) * r(), y0 + (y1 - y0) * r(), r0 + (r1 - r0) * r(), 0, TAU); g.fill(); } },

    while(this.nextNote < now + 1.2){ this.note(this.nextNote); this.nextNote += this.mood.beat * (Math.random() < .22 ? 2 : 1); } },
  bar(t){ const m = this.mood, deg = m.prog[this.barIdx++ % m.prog.length]; this.deg = deg; const dur = m.bar + 3.6;
    [deg, deg + 2, deg + 4, deg + 6].forEach((d, i) => this.pad(t + i * .05, dm(m, d) + 12, dur, .03 - i * .004, m.bright));
    this.bass(t, dm(m, deg) - 12, dur); },
  pad(t, midi, dur, vol, cut){ const c = Aud.ctx, f = mtof(midi), g = c.createGain(), lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = cut; lp.Q.value = .5;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 2.4); g.gain.setValueAtTime(vol, t + dur - 3.2); g.gain.linearRampToValueAtTime(0, t + dur);
    [[-7,'sawtooth',1],[7,'sawtooth',1],[0,'triangle',.5]].forEach(([dt, ty, mul]) => { const o = c.createOscillator(); o.type = ty; o.frequency.value = f * mul; o.detune.value = dt; o.connect(lp); o.start(t); o.stop(t + dur + .05); });
    lp.connect(g); g.connect(Aud.mus); },
  bass(t, midi, dur){ const c = Aud.ctx, g = c.createGain(), o = c.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(midi);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.07, t + 1.6); g.gain.setValueAtTime(.07, t + dur - 3); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); g.connect(Aud.mus); o.start(t); o.stop(t + dur + .05); },
  note(t){ const m = this.mood; if(Math.random() < m.rest) return;
    const chord = [this.deg, this.deg + 2, this.deg + 4].map(d => ((d % 7) + 7) % 7);
    for(let k = 0; k < 4; k++){ this.md += [-2,-1,-1,1,1,2,0,3,-3][Math.floor(Math.random() * 9)]; this.md = Math.max(7, Math.min(16, this.md));
      if(chord.includes(((this.md % 7) + 7) % 7) || Math.random() < .3) break; }
    this.box(t, dm(m, this.md) + 12, .07);
    if(Math.random() < .12) this.box(t + m.beat * .5, dm(m, this.md + 2) + 12, .04); },
  box(t, midi, vol){ const c = Aud.ctx, f = mtof(midi), g = c.createGain(), o = c.createOscillator(), o2 = c.createOscillator(), g2 = c.createGain(), out = c.createGain();
    o.type = 'sine'; o.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * 4.01;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + 2.8);
    g2.gain.setValueAtTime(.0001, t); g2.gain.exponentialRampToValueAtTime(vol * .3, t + .004); g2.gain.exponentialRampToValueAtTime(.0001, t + .5);
    o.connect(g); o2.connect(g2); g.connect(out); g2.connect(out);
    if(c.createStereoPanner){ const p = c.createStereoPanner(); p.pan.value = (Math.random() - .5) * .7; out.connect(p); p.connect(Aud.mus); } else out.connect(Aud.mus);
    o.start(t); o2.start(t); o.stop(t + 2.9); o2.stop(t + .6); }
};
const Sfx = {
  noise(t, dur, type, f0, f1, vol, q){ const c = Aud.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = Aud.noise; f.type = type; f.Q.value = q || .7; f.frequency.setValueAtTime(f0, t); if(f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur * .45);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * .18); g.gain.linearRampToValueAtTime(0, t + dur);
    s.connect(f); f.connect(g); g.connect(Aud.fx); s.start(t, Math.random() * .8); s.stop(t + dur + .05); },
  turn(){ if(!Aud.ctx) return; const t = Aud.ctx.currentTime + .02; this.noise(t, 1.3, 'bandpass', 700, 2600, .3, .7); this.noise(t + .2, .5, 'highpass', 3000, 0, .06); },
  land(){ if(!Aud.ctx) return; this.noise(Aud.ctx.currentTime + .01, .28, 'lowpass', 420, 0, .35, .5); },
  pop(){ if(!Aud.ctx || !Music.mood) return; const t = Aud.ctx.currentTime + .05, m = Music.mood;
    this.noise(t, .16, 'highpass', 1800, 0, .1); [0, 2, 4, 7].forEach((d, i) => Music.box(t + .12 + i * .09, dm(m, Music.deg + d) + 24, .045)); },
  chime(){ if(!Aud.ctx || !Music.mood) return; Music.box(Aud.ctx.currentTime + .02, dm(Music.mood, Music.deg + 7 + Math.floor(Math.random() * 5)) + 24, .06); }
};

/* =========================================================
   낭독: Web Speech API 여성 목소리
   ========================================================= */
const Narr = {
  supported:'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  on:true, vc:{}, pc:{}, token:0, timer:null, utts:[],
  /* 언어별로 여성 목소리만 고른다. 남성 목소리밖에 없으면 자막으로 대신한다. */
  VOICES:{
    ko:{ lang:/^ko/i, name:/korean|한국/i, male:/InJoon|Hyunsu|Gook|Bong|Jinho|Minjun|Hyunwoo|\bMale\b|남성|SMTm/i,
         pref:[/SunHi/i, /Heami/i, /Yuna/i, /Google.*(한국|Korean)/i, /Sora|Seoyeon|Jimin|Yujin|Hyejin|Hana|Sumi|Female|여성|SMTf/i] },
    en:{ lang:/^en/i, name:/^$/, male:/David|Mark|Guy|Ryan|Christopher|Eric|Roger|Steffan|Daniel|\bAlex\b|Fred|\bTom\b|Aaron|Arthur|Andrew|Brian|George|Thomas|Oliver|Rishi|\bMale\b/i,
         pref:[/Aria/i, /Jenny/i, /Sonia/i, /Libby/i, /Michelle/i, /\bAna\b/i, /Emma/i, /Samantha/i, /Google US English/i, /Google UK English Female/i, /Zira/i,
               /Karen|Moira|Tessa|Serena|Victoria|Allison|Ava|Susan|Hazel|Natasha|Clara|Female/i] }
  },
  pick(L){
    L = L || LANG; if(!this.supported) return null; if(this.vc[L]) return this.vc[L];
    const cfg = this.VOICES[L], list = speechSynthesis.getVoices().filter(v => cfg.lang.test(v.lang) || cfg.name.test(v.name)); if(!list.length) return null;
    for(const re of cfg.pref){ const v = list.find(v => re.test(v.name) && !cfg.male.test(v.name)); if(v){ this.vc[L] = v; this.pc[L] = 1.02; return v; } }
    const v = list.find(v => !cfg.male.test(v.name)); if(v){ this.vc[L] = v; this.pc[L] = 1.1; return v; }
    return null;
  },
  prime(){ if(!this.supported) return; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch(e){} },
  stop(){ this.token++; clearTimeout(this.timer); let busy = false;
    if(this.supported) try { busy = speechSynthesis.speaking || speechSynthesis.pending; if(busy) speechSynthesis.cancel(); } catch(e){}
    Aud.duck(false); return busy; },
  play(lines, onLine, onDone){
    const wasBusy = this.stop(), tok = this.token; let i = 0;
    const next = () => {
      if(tok !== this.token) return;
      if(i >= lines.length){ Aud.duck(false); onDone && onDone(); return; }
      const line = lines[i]; onLine(i, line); i++;
      let done = false; const fin = () => { if(done || tok !== this.token) return; done = true; clearTimeout(this.timer); this.timer = setTimeout(next, 650); };
      const v = this.on ? this.pick() : null, en = LANG === 'en';
      if(v){
        const u = new SpeechSynthesisUtterance(line); u.voice = v; u.lang = v.lang; u.rate = en ? .9 : .92; u.pitch = this.pc[LANG] || 1; u.volume = 1;
        u.onend = fin; u.onerror = fin; this.utts.push(u); if(this.utts.length > 30) this.utts.splice(0, 15);
        Aud.duck(true); try { speechSynthesis.resume(); speechSynthesis.speak(u); } catch(e){ fin(); }
        this.timer = setTimeout(fin, 3500 + line.length * (en ? 115 : 240));
      } else {
        Aud.duck(false); this.timer = setTimeout(fin, 1800 + line.length * (en ? 55 : 105));
      }
    };
    /* 방금 cancel()한 직후 곧바로 speak()하면 첫 문장이 버려지는 브라우저가 있어 잠깐 기다린다 */
    if(wasBusy) this.timer = setTimeout(next, 180); else next();
  }
};
if(Narr.supported){ speechSynthesis.onvoiceschanged = () => { Narr.pick('ko'); Narr.pick('en'); }; Narr.pick('ko'); Narr.pick('en'); }

/* =========================================================
   책장 넘기기 제어
   ========================================================= */
const $ = s => document.querySelector(s);
const ui = { cap:$('#capText'), no:$('#chapNo'), ti:$('#chapTitle'), dots:$('#dots'), count:$('#count'), prev:$('#prevBtn'), next:$('#nextBtn'), again:$('#againBtn'),
  music:$('#tgMusic'), voice:$('#tgVoice'), auto:$('#tgAuto'), replay:$('#tgReplay'), note:$('#voiceNote'), open:$('#openBtn'), loading:$('#loading'),
  home:$('#homeBtn'), lang:$('#tgLang') };
const ST = { cur:-1, busy:false, turn:null, auto:true, started:false };
let autoTimer = null, capTimer = null, noteTimer = null;

function setCaption(t){ ui.cap.classList.add('out'); clearTimeout(capTimer); capTimer = setTimeout(() => { ui.cap.textContent = t; if(t) ui.cap.classList.remove('out'); }, REDUCED ? 0 : 320); }
function setChapter(i){ ui.no.textContent = `${String(i + 1).padStart(2, '0')} / ${SC.length}`; ui.ti.textContent = TX(i).title; ui.count.textContent = `${i + 1} / ${SC.length}`;
  [...ui.dots.children].forEach((d, k) => { d.classList.toggle('on', k === i); d.setAttribute('aria-current', k === i ? 'page' : 'false'); });
  ui.prev.disabled = i <= 0; ui.next.hidden = i >= SC.length - 1; ui.again.hidden = true; }
SC.forEach((s, i) => { const b = document.createElement('button'); b.className = 'dot'; b.onclick = () => go(i); ui.dots.appendChild(b); });

/* to === -1 은 책을 덮고 표지로 돌아가는 넘김 */
function go(to){
  if(!ST.started || ST.busy || to === ST.cur || to < -1 || to >= SC.length) return;
  clearTimeout(autoTimer); Narr.stop(); setCaption('');
  const from = ST.cur, fwd = to > from, toCover = to < 0;
  ensure(toCover ? 0 : to);
  if(from >= 0 && objs[from]) foldScene(objs[from]);
  setMap(leafFrontMat, fwd ? (from < 0 ? coverTex : spreadOf(from).R) : (toCover ? coverTex : spreadOf(to).R));
  setMap(leafBackMat, fwd ? spreadOf(to).L : spreadOf(from).L);
  ST.turn = { t:0, fwd, from, to, started:false, landed:false, rose:false, half:false };
  ST.busy = true; camMode = toCover ? 'cover' : 'open';
  if(toCover){ LT = lookOf(COVER_LOOK); document.body.classList.add('closing'); }
  else { LT = lookOf(SC[to].look); Music.setMood(SC[to].mood); setChapter(to); }
}
function updateTurn(dt){
  const T = ST.turn; T.t += dt;
  const L0 = T.from < 0 ? .2 : (REDUCED ? .3 : .55), LD = REDUCED ? .6 : 1.45;
  const p = clamp((T.t - L0) / LD);
  if(T.t >= L0 && !T.started){ T.started = true; showLeaf(true); Sfx.turn();
    if(T.fwd) setMap(pageMatR, spreadOf(T.to).R); else if(T.to >= 0) setMap(pageMatL, spreadOf(T.to).L); else pageL.visible = false; }
  if(!T.started) return;
  const e = ease(p), theta = T.fwd ? Math.PI * e : Math.PI * (1 - e);
  setLeaf(theta, (T.fwd ? -1 : 1) * .75 * Math.sin(theta));
  if(T.from < 0 && !T.half && theta > Math.PI * .5){ T.half = true; [pageL, stackL, boardL].forEach(m => m.visible = true); setMap(pageMatL, spreadOf(T.to).L); }
  if(T.to < 0 && !T.half && theta < Math.PI * .5){ T.half = true; [stackL, boardL].forEach(m => m.visible = false); }
  if(T.to >= 0 && p >= .86 && !T.rose){ T.rose = true; riseScene(objs[T.to]); Sfx.pop(); }
  if(p >= 1 && !T.landed){ T.landed = true; Sfx.land();
    if(T.to < 0) setMap(pageMatR, spreadOf(0).R);
    else { showLeaf(false); if(T.fwd) setMap(pageMatL, spreadOf(T.to).L); else setMap(pageMatR, spreadOf(T.to).R); } }
  if(T.landed && T.t > L0 + LD + .25){
    ST.cur = T.to; ST.busy = false; ST.turn = null;
    const c = ST.cur;
    if(c < 0){ prune([0, 1]); document.body.classList.remove('open', 'closing'); applyPendingLang(); return; }
    prune([c - 1, c, c + 1]);
    setTimeout(() => { if(ST.cur === c){ ensure(c + 1); ensure(c - 1); } }, 3200);
    if(applyPendingLang()) return;
    setTimeout(() => { if(ST.cur === c && !ST.busy) narrate(c); }, 900);
  }
}
function narrate(i){
  clearTimeout(autoTimer);
  Narr.play(TX(i).narr, (k, line) => setCaption(line), () => {
    if(i === SC.length - 1){ ui.again.hidden = false; return; }
    if(ST.auto) autoTimer = setTimeout(() => { if(!ST.busy && ST.cur === i) go(i + 1); }, 2600);
  });
}
function showNote(t){ ui.note.textContent = t; ui.note.hidden = false; clearTimeout(noteTimer); noteTimer = setTimeout(() => ui.note.hidden = true, 6500); }
function voiceCheck(){ if(!Narr.supported) showNote(UI[LANG].noSpeech); else if(Narr.on && !Narr.pick()) showNote(UI[LANG].noVoice); else ui.note.hidden = true; }

/* ---------- 한국어 ⇄ English ---------- */
let pendingLang = null;
function applyTexts(){
  const t = UI[LANG];
  document.documentElement.lang = LANG; document.body.classList.toggle('en', LANG === 'en'); document.title = t.doc;
  document.querySelectorAll('[data-t]').forEach(el => { if(el.hasAttribute('data-html')) el.innerHTML = t[el.dataset.t]; else el.textContent = t[el.dataset.t]; });
  document.querySelectorAll('[data-tt]').forEach(el => el.title = t[el.dataset.tt]);
  document.querySelectorAll('[data-ta]').forEach(el => el.setAttribute('aria-label', t[el.dataset.ta]));
  ui.lang.setAttribute('aria-label', t.langTip);
  [...ui.dots.children].forEach((b, i) => { b.title = t.dot(i, TX(i).title); b.setAttribute('aria-label', b.title); });
  if(ST.cur >= 0) setChapter(ST.cur);
}
function rebuildTextures(){
  if(coverTex){ coverTex.dispose(); coverTex = makeCover(); }
  Object.keys(spreads).forEach(k => { spreads[k].L.dispose(); spreads[k].R.dispose(); delete spreads[k]; });
  if(ST.cur < 0){ setMap(leafFrontMat, coverTex); setMap(leafBackMat, spreadOf(0).L); setMap(pageMatR, spreadOf(0).R); }
  else { setMap(pageMatL, spreadOf(ST.cur).L); setMap(pageMatR, spreadOf(ST.cur).R); }
}
function setLang(l){
  LANG = l; try { localStorage.setItem('ai-popup-lang', l); } catch(e){}
  applyTexts(); if(coverTex) rebuildTextures();
  if(ST.started){ voiceCheck(); if(ST.cur >= 0) narrate(ST.cur); }
}
function applyPendingLang(){ if(!pendingLang) return false; const l = pendingLang; pendingLang = null; if(l !== LANG){ setLang(l); return ST.cur >= 0; } return false; }

/* ---------- 입력 ---------- */
ui.prev.onclick = () => go(ST.cur - 1);
ui.next.onclick = () => go(ST.cur + 1);
ui.again.onclick = () => go(0);
ui.home.onclick = () => go(-1);
ui.lang.onclick = () => { const l = (pendingLang || LANG) === 'ko' ? 'en' : 'ko';
  if(ST.busy){ pendingLang = l; const t = UI[l]; ui.lang.querySelector('span').textContent = t.lang; return; }
  setLang(l); };
ui.music.onclick = () => { const on = ui.music.getAttribute('aria-pressed') !== 'true'; ui.music.setAttribute('aria-pressed', on); Aud.setOn(on); };
ui.voice.onclick = () => { const on = ui.voice.getAttribute('aria-pressed') !== 'true'; ui.voice.setAttribute('aria-pressed', on); Narr.on = on;
  if(!on && Narr.supported) try { speechSynthesis.cancel(); } catch(e){} };
ui.auto.onclick = () => { ST.auto = ui.auto.getAttribute('aria-pressed') !== 'true'; ui.auto.setAttribute('aria-pressed', ST.auto); if(!ST.auto) clearTimeout(autoTimer); };
ui.replay.onclick = () => { if(ST.started && !ST.busy && ST.cur >= 0) narrate(ST.cur); };
addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
  if(ST.cur < 0){ if(e.key === 'Enter' && !ui.open.disabled && !ST.busy) ui.open.click(); return; }
  if(e.key === 'ArrowRight' || e.key === 'PageDown') go(ST.cur + 1);
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp') go(ST.cur - 1);
  else if(e.key === 'Home' || e.key === 'Escape') go(-1);
});
let down = null;
canvas.addEventListener('pointerdown', e => { down = { x:e.clientX, y:e.clientY, t:performance.now() }; });
canvas.addEventListener('pointerup', e => { if(!down || ST.cur < 0) return; const dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(ST.cur + (dx < 0 ? 1 : -1)); });

ui.open.onclick = () => {
  if(ST.busy || ST.cur >= 0) return;
  Aud.init();
  if(!ST.started){ ST.started = true; Narr.prime(); Music.start(SC[0].mood); setTimeout(voiceCheck, 1600); }
  document.body.classList.add('open');
  go(0);
};

/* =========================================================
   시작
   ========================================================= */
let coverTex = null;
let last = performance.now(), T = 0;
function tick(dt){
  T += dt;
  if(ST.turn) updateTurn(dt);
  for(const k in objs) updateScene(objs[k], dt, T);
  updateLook(dt); updateCamera(dt, T, false);
  pMat.uniforms.uTime.value = T;
}
function frame(now){
  requestAnimationFrame(frame);
  tick(Math.min(.1, (now - last) / 1000)); last = now;
  renderer.render(scene, cam);
}
async function boot(){
  applyTexts();
  const sample = SC.map(s => s.title + s.line).join('') + '제장끝사랑을배운아이입체그림책열네개의장면영화에바치는헌정「」()·—0123456789';
  const enSample = EN.map(s => s.title + s.line).join('') + 'A.I. Chapter The End Pop-up Book Fourteen Scenes 0123456789 —·()';
  try { await Promise.race([ Promise.all([
      document.fonts.load('400 40px "Gowun Batang"', sample), document.fonts.load('700 40px "Gowun Batang"', sample),
      document.fonts.load('italic 500 80px "Cormorant Garamond"', enSample), document.fonts.load('500 80px "Cormorant Garamond"', enSample),
      document.fonts.load('italic 400 80px "Cormorant Garamond"', enSample) ]),
    new Promise(r => setTimeout(r, 4000)) ]); } catch(e){}
  resize();
  coverTex = makeCover();
  ensure(0);
  setMap(leafFrontMat, coverTex); setMap(leafBackMat, spreadOf(0).L); setMap(pageMatR, spreadOf(0).R);
  [pageL, stackL, boardL].forEach(m => m.visible = false);
  setLeaf(0, 0); showLeaf(true);
  updateLook(1); updateCamera(0, 0, true);
  requestAnimationFrame(t => { last = t; frame(t); });
  ui.loading.classList.add('gone'); ui.open.disabled = false;
  setTimeout(() => ensure(1), 600);
}
boot();
})();
</script>
